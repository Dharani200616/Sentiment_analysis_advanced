<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Register | Create Account</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Arial', sans-serif;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 215, 0, 0.18), transparent 22%),
                radial-gradient(circle at 80% 30%, rgba(255, 255, 255, 0.08), transparent 18%),
                radial-gradient(circle at 50% 80%, rgba(255, 200, 0, 0.12), transparent 24%),
                linear-gradient(135deg, #050507, #111118 50%, #070709);
            position: relative;
            padding: 20px;
        }

        /* subtle star-dust effect */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 10% 15%, rgba(255, 255, 255, 0.04) 0 2px, transparent 3px),
                radial-gradient(circle at 30% 70%, rgba(255, 255, 255, 0.03) 0 2px, transparent 3px),
                radial-gradient(circle at 70% 25%, rgba(255, 255, 255, 0.04) 0 2px, transparent 3px),
                radial-gradient(circle at 90% 65%, rgba(255, 255, 255, 0.03) 0 2px, transparent 3px);
            pointer-events: none;
            opacity: 0.7;
            z-index: 0;
        }

        /* floating emoji animation */
        .emoji {
            position: fixed;
            font-size: 2rem;
            animation: floatUp 10s linear infinite;
            opacity: 0.85;
            z-index: 1;
            user-select: none;
            pointer-events: none;
            bottom: -10%;
        }

        .e1 {
            left: 8%;
            animation-delay: 0s;
            font-size: 2rem;
        }

        .e2 {
            left: 20%;
            animation-delay: 1.5s;
            font-size: 2.1rem;
        }

        .e3 {
            left: 35%;
            animation-delay: 3s;
            font-size: 1.9rem;
        }

        .e4 {
            left: 52%;
            animation-delay: 0.8s;
            font-size: 2.2rem;
        }

        .e5 {
            left: 68%;
            animation-delay: 2.2s;
            font-size: 2rem;
        }

        .e6 {
            left: 82%;
            animation-delay: 4s;
            font-size: 2.3rem;
        }

        .e7 {
            left: 94%;
            animation-delay: 5.6s;
            font-size: 1.8rem;
            display: none;
        }

        @media (min-width: 640px) {
            .e7 {
                display: block;
            }
        }

        @keyframes floatUp {
            0% {
                bottom: -15%;
                transform: translateX(0) rotate(0deg) scale(0.7);
                opacity: 0;
            }

            15% {
                opacity: 0.9;
            }

            85% {
                opacity: 0.9;
            }

            100% {
                bottom: 110%;
                transform: translateX(20px) rotate(320deg) scale(1.2);
                opacity: 0;
            }
        }

        /* glass card */
        .card {
            position: relative;
            z-index: 12;
            width: min(92vw, 440px);
            padding: 34px 28px 38px;
            border-radius: 40px;
            background: rgba(20, 20, 35, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 215, 0, 0.1) inset;
            transition: transform 0.25s ease;
            color: #fff;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 215, 0, 0.45);
            box-shadow: 0 28px 48px rgba(0, 0, 0, 0.6);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FFF8E7, #FFE5A3);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 6px;
            letter-spacing: -0.2px;
        }

        .sub {
            color: rgba(255, 245, 210, 0.85);
            margin-bottom: 24px;
            font-size: 0.9rem;
            font-weight: 400;
            border-bottom: 1px dashed rgba(255, 215, 0, 0.3);
            display: inline-block;
            padding-bottom: 5px;
        }

        .input-field {
            width: 100%;
            margin: 12px 0;
        }

        .input-field input {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            outline: none;
            border-radius: 34px;
            background: rgba(15, 15, 25, 0.6);
            color: #fef9e6;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .input-field input:focus {
            border-color: #ffcd4a;
            background: rgba(25, 25, 40, 0.8);
            box-shadow: 0 0 0 3px rgba(255, 205, 74, 0.2);
        }

        .input-field input::placeholder {
            color: rgba(240, 230, 200, 0.7);
            font-weight: 400;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 14px;
            border: none;
            border-radius: 44px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 700;
            color: #1e1a0c;
            background: linear-gradient(105deg, #FFDD77, #FFB347);
            box-shadow: 0 10px 18px rgba(255, 160, 60, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            letter-spacing: 0.3px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 28px rgba(255, 160, 60, 0.45);
            background: linear-gradient(105deg, #FFE28C, #FFA73D);
        }

        button:active {
            transform: translateY(1px);
        }

        #message {
            margin-top: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            min-height: 48px;
            padding: 6px 8px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
        }

        .success {
            color: #B2FF9E;
            text-shadow: 0 0 3px #1f4f1a;
        }

        .error {
            color: #FFB3B3;
            text-shadow: 0 0 2px #4a1e1e;
        }

        .note {
            margin-top: 18px;
            color: rgba(255, 245, 210, 0.65);
            font-size: 0.75rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 12px;
            border-radius: 50px;
            display: inline-block;
            backdrop-filter: blur(2px);
        }

        /* disable button style while redirecting */
        button:disabled {
            opacity: 0.7;
            transform: none;
            cursor: wait;
            filter: grayscale(0.1);
        }

        /* simple responsive */
        @media (max-width: 480px) {
            .card {
                padding: 28px 20px 32px;
            }

            h1 {
                font-size: 1.9rem;
            }

            .input-field input {
                padding: 12px 16px;
            }
        }
    </style>
</head>

<body>
    <!-- floating joyful emojis -->
    <div class="emoji e1">😊</div>
    <div class="emoji e2">😄</div>
    <div class="emoji e3">🙂</div>
    <div class="emoji e4">✨</div>
    <div class="emoji e5">🌟</div>
    <div class="emoji e6">😊</div>
    <div class="emoji e7">🎉</div>

    <div class="card">
        <h1>Register</h1>
        <div class="sub">Create your account</div>

        <form id="registerForm" novalidate>
            <div class="input-field">
                <input type="text" id="name" placeholder="Full Name" autocomplete="name" required />
            </div>
            <div class="input-field">
                <input type="email" id="email" placeholder="Email address" autocomplete="email" required />
            </div>
            <div class="input-field">
                <input type="password" id="password" placeholder="Password (min. 6 characters)"
                    autocomplete="new-password" required />
            </div>
            <div class="input-field">
                <input type="password" id="confirmPassword" placeholder="Confirm password" autocomplete="off"
                    required />
            </div>
            <button type="submit" id="submitBtn">✨ Register ✨</button>
        </form>

        <div id="message"></div>
        <div class="note">✅ After successful registration, you'll be redirected to the login page.</div>
    </div>

    <script>
        (function () {
            const form = document.getElementById("registerForm");
            const messageDiv = document.getElementById("message");
            const submitBtn = document.getElementById("submitBtn");

            let redirectTimer = null;
            let isProcessing = false;   // prevent multiple submissions

            // Helper to show message
            function showMessage(text, type) {
                if (!messageDiv) return;
                messageDiv.textContent = text;
                messageDiv.className = type === "success" ? "success" : "error";
                // auto-clear old error after 5 seconds if not redirection (but not interfering)
                if (type !== "success") {
                    if (window._msgTimeout) clearTimeout(window._msgTimeout);
                    window._msgTimeout = setTimeout(() => {
                        if (messageDiv && messageDiv.className !== "success") {
                            messageDiv.textContent = "";
                        }
                    }, 4000);
                }
            }

            // clear any existing timer and reset processing flag on redirect abort
            function cancelRedirect() {
                if (redirectTimer) {
                    clearTimeout(redirectTimer);
                    redirectTimer = null;
                }
            }

            // final registration logic
            function performRegistration(name, email, password, confirmPass) {
                // Reset any ongoing redirect
                cancelRedirect();

                // Field validations
                if (!name || !email || !password || !confirmPass) {
                    showMessage("⚠️ Please fill in all fields.", "error");
                    return false;
                }

                if (password.length < 6) {
                    showMessage("🔒 Password must be at least 6 characters.", "error");
                    return false;
                }

                if (password !== confirmPass) {
                    showMessage("❌ Passwords do not match. Please re-enter.", "error");
                    return false;
                }

                // Simple email format check (basic)
                const emailPattern = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
                if (!emailPattern.test(email)) {
                    showMessage("📧 Please enter a valid email address (e.g., name@domain.com).", "error");
                    return false;
                }

                // Additional: Trim spaces and ensure name has at least 2 non-space chars
                if (name.trim().length < 2) {
                    showMessage("👤 Name should contain at least 2 characters.", "error");
                    return false;
                }

                // ----------------- SIMULATED BACKEND SUCCESS -----------------
                // In a real scenario we'd send data to server. Here we always succeed.
                const registrationSuccessful = true;

                if (registrationSuccessful) {
                    // Store a small flag to simulate user awareness (optional)
                    // But we show success and redirect to login.html after delay
                    showMessage("🎉 Registration successful! Redirecting to login page...", "success");

                    // Disable submit button to prevent double navigation
                    if (submitBtn) {
                        submitBtn.disabled = true;
                        submitBtn.textContent = "✓ Redirecting ...";
                    }

                    // Set redirect timer to login.html
                    redirectTimer = setTimeout(() => {
                        window.location.href = "login.html";
                    }, 2000);
                    return true;
                } else {
                    // Fallback (never happens in this demo, but kept for logic)
                    showMessage("⚠️ Could not create account. Please try again later.", "error");
                    if (submitBtn) submitBtn.disabled = false;
                    return false;
                }
            }

            // onSubmit handler
            async function handleSubmit(e) {
                e.preventDefault();

                // double check flag
                if (isProcessing) {
                    showMessage("⏳ Please wait, already processing your request...", "error");
                    return;
                }

                // Cancel any ongoing redirection before new submit (prevents inconsistent state)
                if (redirectTimer) {
                    clearTimeout(redirectTimer);
                    redirectTimer = null;
                }

                const nameInput = document.getElementById("name");
                const emailInput = document.getElementById("email");
                const passwordInput = document.getElementById("password");
                const confirmInput = document.getElementById("confirmPassword");

                if (!nameInput || !emailInput || !passwordInput || !confirmInput) return;

                const name = nameInput.value.trim();
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                const confirmPassword = confirmInput.value;

                // simple lock
                isProcessing = true;

                // tiny delay to mimic async feeling, but validation is sync
                try {
                    const result = performRegistration(name, email, password, confirmPassword);
                    if (!result) {
                        // if registration fails, re-enable button and unlock
                        if (submitBtn) {
                            submitBtn.disabled = false;
                            submitBtn.textContent = "✨ Register ✨";
                        }
                        isProcessing = false;
                    } else {
                        // success: button remains disabled (redirect will happen)
                        // isProcessing will stay true, but redirect resets anyway.
                        // No need to revert processing flag because page unloads.
                    }
                } catch (err) {
                    console.warn(err);
                    showMessage("Unexpected error, please refresh & try again.", "error");
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.textContent = "✨ Register ✨";
                    }
                    isProcessing = false;
                }
            }

            // Bind event
            if (form) {
                form.addEventListener("submit", handleSubmit);
            }

            // Optional: real-time password match indicator (nice UX)
            const pwd = document.getElementById("password");
            const confirmPwd = document.getElementById("confirmPassword");
            const nameField = document.getElementById("name");
            const emailField = document.getElementById("email");

            function clearMessageOnFocus() {
                if (messageDiv && messageDiv.className === "error") {
                    // optional: dont clear success messages automatically to keep redirect info
                    if (!messageDiv.textContent.includes("successful") && !messageDiv.textContent.includes("Redirecting")) {
                        // but we can keep feedback but avoid aggressive reset
                    }
                }
            }

            // add small live hint for password match (clean)
            if (confirmPwd && pwd) {
                const showMatchHint = () => {
                    if (pwd.value.length > 0 && confirmPwd.value.length > 0) {
                        if (pwd.value !== confirmPwd.value) {
                            // we don't spam, but we can subtle hint but not override message unless needed.
                            // but just set a temporary style? Better not to disturb main message.
                            if (!messageDiv.textContent.includes("match") && document.activeElement === confirmPwd) {
                                // show temporary soft hint only if not clashing
                                if (messageDiv.textContent === "" || messageDiv.textContent.includes("match")) {
                                    // fine, keep silent not to flood
                                }
                            }
                        }
                    }
                };
                confirmPwd.addEventListener("input", () => {
                    // remove previous match-related error if user typing
                    if (messageDiv && messageDiv.textContent.toLowerCase().includes("passwords do not match")) {
                        if (pwd.value === confirmPwd.value) {
                            messageDiv.textContent = "";
                        }
                    }
                });
                pwd.addEventListener("input", () => {
                    if (messageDiv && messageDiv.textContent.toLowerCase().includes("passwords do not match")) {
                        if (pwd.value === confirmPwd.value) {
                            messageDiv.textContent = "";
                        }
                    }
                });
            }

            // Additional: clear generic field errors when typing in any field (nice)
            const allInputs = [nameField, emailField, pwd, confirmPwd];
            allInputs.forEach(input => {
                if (input) {
                    input.addEventListener("focus", () => {
                        if (messageDiv && messageDiv.className === "error" && !messageDiv.textContent.includes("Redirecting")) {
                            // only clear error but keep success untouched
                            if (!messageDiv.textContent.includes("successful")) {
                                // but don't clear important redirect message
                                if (!redirectTimer) {
                                    // messageDiv.textContent = "" ; (opting for less aggressive clear, but better ux)
                                }
                            }
                        }
                    });
                }
            });

            // Extra safeguard: if any script tries to resubmit while redirecting, stop propagation
            window.addEventListener("beforeunload", function () {
                if (redirectTimer) {
                    // page is leaving, no need
                }
            });
        })();
    </script>
</body>

</html>
